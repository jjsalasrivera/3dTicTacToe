[package]
name = "tres_en_raya_3d"
version = "0.1.0"
edition = "2021"
description = "3D tic-tac-toe (3x3x3 with gravity) in Rust + Bevy"

[dependencies]
bevy = "0.19"
bevy_panorbit_camera = "0.35"

# Compilación más rápida de dependencias en modo dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
